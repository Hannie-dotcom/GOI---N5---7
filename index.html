<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flashcard Minna no Nihongo - Bài 7</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        
        body {
            background: linear-gradient(rgba(255, 245, 247, 0.55), rgba(240, 220, 225, 0.65)),
                        url('https://images.unsplash.com/photo-1522383225653-ed111181a951?q=80&w=1920&auto=format&fit=crop') center/cover no-repeat fixed;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
            position: relative;
        }

        /* Hiệu ứng Cánh hoa anh đào rơi */
        .sakura-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; }
        .petal {
            position: absolute;
            background: #ffb7c5;
            border-radius: 15px 0 15px 0;
            opacity: 0.75;
            filter: drop-shadow(0 2px 4px rgba(216, 90, 127, 0.2));
            animation: fall linear infinite;
        }
        @keyframes fall {
            0% { transform: translate(0, -10px) rotate(0deg); opacity: 0.8; }
            100% { transform: translate(120px, 105vh) rotate(360deg); opacity: 0; }
        }

        .app-card {
            position: relative;
            z-index: 2;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            width: 100%;
            max-width: 460px;
            border-radius: 28px;
            padding: 32px 24px;
            border: 1.5px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 20px 40px rgba(180, 100, 120, 0.15);
            text-align: center;
        }

        .header { display: flex; justify-content: space-between; font-size: 14px; font-weight: 600; color: #b06d7e; margin-bottom: 20px; }

        /* Flashcard Lật 3D */
        .flashcard-wrapper {
            perspective: 1000px;
            width: 100%;
            height: 230px;
            margin-bottom: 20px;
            cursor: pointer;
        }
        .flashcard {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
            border-radius: 20px;
            box-shadow: 0 8px 20px rgba(216, 90, 127, 0.12);
        }
        .flashcard.flipped { transform: rotateY(180deg); }

        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: 2px solid #f2d5db;
            background: #ffffff;
            padding: 16px;
        }
        .card-front { color: #3a2e30; }
        .card-back {
            background: #fff8f9;
            color: #d85a7f;
            transform: rotateY(180deg);
        }

        .kanji-text { font-size: 38px; font-weight: 700; letter-spacing: 2px; }
        .hint-text { font-size: 12px; color: #b06d7e; margin-top: 10px; opacity: 0.8; }
        
        .hiragana-text { font-size: 22px; font-weight: 600; color: #d85a7f; margin-bottom: 2px; }
        .meaning-text { font-size: 18px; font-weight: 700; color: #4a383b; margin-bottom: 10px; }
        
        /* Khung câu ví dụ */
        .example-box {
            background: rgba(216, 90, 127, 0.08);
            border-left: 3px solid #d85a7f;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 13px;
            color: #5a4046;
            text-align: left;
            width: 100%;
        }
        .example-jp { font-weight: 600; color: #3a2e30; }
        .example-vi { font-size: 12px; color: #7a5c63; }

        /* Danh sách 4 lựa chọn tiếng Việt */
        .options-grid { display: flex; flex-direction: column; gap: 10px; }
        .opt-btn {
            background: rgba(255, 255, 255, 0.9);
            border: 1.5px solid #f2d5db;
            color: #4a383b;
            padding: 12px 14px;
            border-radius: 16px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            text-align: left;
        }
        .opt-btn:hover:not(:disabled) { background: #fff5f7; border-color: #d85a7f; transform: translateY(-1px); }
        .opt-btn.correct { background: #e8f5e9 !important; border-color: #66bb6a !important; color: #2e7d32 !important; }
        .opt-btn.wrong { background: #ffebee !important; border-color: #ef5350 !important; color: #c62828 !important; }
        .opt-btn:disabled { cursor: default; }

        .controls { display: flex; gap: 10px; margin-top: 16px; }
        .nav-btn {
            flex: 1; padding: 12px; border: none; background: #f2d5db; color: #8c5665;
            font-weight: 600; border-radius: 14px; cursor: pointer; transition: 0.2s;
        }
        .nav-btn:hover { background: #d85a7f; color: white; }

        /* Màn hình Chúc mừng khi hoàn thành */
        .congrats-card {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px 10px;
        }
        .congrats-icon { font-size: 60px; margin-bottom: 12px; }
        .congrats-title { font-size: 24px; font-weight: 700; color: #d85a7f; margin-bottom: 8px; }
        .congrats-desc { font-size: 15px; color: #5a4046; margin-bottom: 24px; line-height: 1.5; }
        .restart-btn {
            background: linear-gradient(135deg, #e07a9e 0%, #d85a7f 100%);
            color: white; border: none; padding: 14px 32px; border-radius: 16px;
            font-size: 16px; font-weight: 600; cursor: pointer; transition: all 0.2s;
            box-shadow: 0 4px 12px rgba(216, 90, 127, 0.3);
        }
        .restart-btn:hover { opacity: 0.95; transform: translateY(-2px); }
    </style>
</head>
<body>

    <div class="sakura-container" id="sakura-box"></div>

    <div class="app-card">
        <!-- Khung học Flashcard chính -->
        <div id="learning-section">
            <div class="header">
                <span id="lesson-title">Minna no Nihongo - Bài 7</span>
                <span id="card-count">1 / 34</span>
            </div>

            <!-- Flashcard lật 3D -->
            <div class="flashcard-wrapper" onclick="toggleFlip()">
                <div class="flashcard" id="card">
                    <div class="card-front">
                        <div class="kanji-text" id="kanji-display">切ります</div>
                        <div class="hint-text">💡 Chạm vào đây để lật xem cách đọc & ví dụ</div>
                    </div>
                    <div class="card-back">
                        <div class="hiragana-text" id="hiragana-display">きります</div>
                        <div class="meaning-text" id="meaning-display">Cắt</div>
                        <div class="example-box">
                            <div class="example-jp" id="example-jp">はさみで 紙を 切ります。</div>
                            <div class="example-vi" id="example-vi">Tôi cắt giấy bằng kéo.</div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 4 Lựa chọn trắc nghiệm tiếng Việt -->
            <div class="options-grid" id="options-box">
                <button class="opt-btn" onclick="checkAnswer(this)"></button>
                <button class="opt-btn" onclick="checkAnswer(this)"></button>
                <button class="opt-btn" onclick="checkAnswer(this)"></button>
                <button class="opt-btn" onclick="checkAnswer(this)"></button>
            </div>

            <!-- Điều hướng -->
            <div class="controls">
                <button class="nav-btn" onclick="prevCard()">← Thẻ trước</button>
                <button class="nav-btn" onclick="nextCard()">Thẻ tiếp →</button>
            </div>
        </div>

        <!-- Màn hình Chúc mừng sau khi hoàn thành -->
        <div class="congrats-card" id="congrats-section">
            <div class="congrats-icon">🌸🎉</div>
            <div class="congrats-title">おめでとうございます!</div>
            <div class="congrats-desc">
                Chúc mừng bạn đã hoàn thành trọn bộ <strong>34 từ vựng Bài 7</strong>!<br>
                Điểm số trả lời đúng: <strong id="score-text" style="color:#d85a7f;">0/34</strong>
            </div>
            <button class="restart-btn" onclick="restartLesson()">🔄 Học lại Bài 7</button>
        </div>
    </div>

    <script>
        function createPetal() {
            const box = document.getElementById('sakura-box');
            const p = document.createElement('div');
            p.classList.add('petal');
            p.style.width = Math.random() * 8 + 8 + 'px';
            p.style.height = Math.random() * 10 + 10 + 'px';
            p.style.left = Math.random() * 100 + 'vw';
            p.style.animationDuration = Math.random() * 4 + 6 + 's';
            box.appendChild(p);
            setTimeout(() => p.remove(), 10000);
        }
        setInterval(createPetal, 400);

        // Danh sách từ vựng Bài 7 trích xuất chính xác từ sách Minna no Nihongo I
        const vocabList = [
            { kanji: '切ります', hiragana: 'きります', meaning: 'Cắt', exJp: 'はさみで 紙を 切ります。', exVi: 'Tôi cắt giấy bằng kéo.' },
            { kanji: '送ります', hiragana: 'おくります', meaning: 'Gửi', exJp: 'もう メールを 送りました。', exVi: 'Tôi đã gửi email rồi.' },
            { kanji: 'あげます', hiragana: 'あげます', meaning: 'Cho / Tặng', exJp: '木村さんに 花を あげます。', exVi: 'Tôi tặng hoa cho chị Kimura.' },
            { kanji: 'もらいます', hiragana: 'もらいます', meaning: 'Nhận', exJp: 'カリナさんに チョコレートを もらいました。', exVi: 'Tôi đã nhận sô-cô-la từ chị Karina.' },
            { kanji: '貸します', hiragana: 'かします', meaning: 'Cho mượn / Cho vay', exJp: 'イーさんに 本を 貸しました。', exVi: 'Tôi cho chị Lee mượn sách.' },
            { kanji: '借ります', hiragana: 'かります', meaning: 'Mượn / Vay', exJp: 'カリナさんに CDを 借りました。', exVi: 'Tôi đã mượn đĩa CD từ chị Karina.' },
            { kanji: '教えます', hiragana: 'おしえます', meaning: 'Dạy', exJp: '山田さんに 英語を 教えます。', exVi: 'Tôi dạy tiếng Anh cho anh Yamada.' },
            { kanji: '習います', hiragana: 'ならいます', meaning: 'Học', exJp: 'ワンさんに 中国語を 習います。', exVi: 'Tôi học tiếng Trung Quốc từ anh Wang.' },
            { kanji: 'かけます［電話を～］', hiragana: 'かけます', meaning: 'Gọi ［điện thoại］', exJp: '会社に 電話を かけます。', exVi: 'Tôi gọi điện thoại cho công ty.' },
            { kanji: '手', hiragana: 'て', meaning: 'Tay', exJp: '手で ごはんを 食べます。', exVi: 'Tôi ăn cơm bằng tay.' },
            { kanji: 'はし', hiragana: 'はし', meaning: 'Đũa', exJp: 'はしで 食べます。', exVi: 'Tôi ăn bằng đũa.' },
            { kanji: 'スプーン', hiragana: 'すぷーん', meaning: 'Thìa / Muỗng', exJp: 'スプーンで スープを 飲みます。', exVi: 'Tôi uống súp bằng thìa.' },
            { kanji: 'ナイフ', hiragana: 'ないふ', meaning: 'Dao', exJp: 'ナイフで 肉を 切ります。', exVi: 'Tôi cắt thịt bằng dao.' },
            { kanji: 'フォーク', hiragana: 'ふぉーく', meaning: 'Nĩa / Đĩa', exJp: 'フォークで 食べます。', exVi: 'Tôi ăn bằng nĩa.' },
            { kanji: 'はさみ', hiragana: 'はさみ', meaning: 'Kéo', exJp: 'はさみで 紙を 切ります。', exVi: 'Tôi cắt giấy bằng kéo.' },
            { kanji: 'パソコン', hiragana: 'ぱそこん', meaning: 'Máy tính cá nhân', exJp: 'パソコンで 映画を 見ます。', exVi: 'Tôi xem phim bằng máy tính.' },
            { kanji: 'ケータイ', hiragana: 'けーたい', meaning: 'Điện thoại di động', exJp: 'ケータイで メールを 送ります。', exVi: 'Tôi gửi email bằng điện thoại di động.' },
            { kanji: 'メール', hiragana: 'めーる', meaning: 'Thư điện tử / Email', exJp: 'メールを 送りました。', exVi: 'Tôi đã gửi email.' },
            { kanji: '年賀状', hiragana: 'ねんがじょう', meaning: 'Thiệp mừng năm mới', exJp: '先生に 年賀状を 書きます。', exVi: 'Tôi viết thiệp mừng năm mới cho thầy cô.' },
            { kanji: 'パンチ', hiragana: 'ぱんち', meaning: 'Dụng cụ đục lỗ', exJp: 'パンチで 穴を あけます。', exVi: 'Đục lỗ bằng đục lỗ.' },
            { kanji: 'ホッチキス', hiragana: 'ほっちきす', meaning: 'Cái dập ghim', exJp: 'ホッチキスで とめます。', exVi: 'Kẹp lại bằng dập ghim.' },
            { kanji: 'セロテープ', hiragana: 'せろてーぷ', meaning: 'Băng dính', exJp: 'セロテープで はります。', exVi: 'Dán bằng băng dính.' },
            { kanji: '消しゴム', hiragana: 'けしごむ', meaning: 'Cục tẩy / Cục gôm', exJp: '消しゴムを 借りました。', exVi: 'Tôi đã mượn cục tẩy.' },
            { kanji: '紙', hiragana: 'かみ', meaning: 'Giấy', exJp: '紙に 名前を 書きます。', exVi: 'Tôi viết tên lên giấy.' },
            { kanji: '花', hiragana: 'はな', meaning: 'Hoa', exJp: '木村さんに 花を あげました。', exVi: 'Tôi đã tặng hoa cho chị Kimura.' },
            { kanji: 'シャツ', hiragana: 'しゃつ', meaning: 'Áo sơ mi', exJp: '父に シャツを もらいました。', exVi: 'Tôi đã nhận áo sơ mi từ bố.' },
            { kanji: 'プレゼント', hiragana: 'ぷれぜんと', meaning: 'Quà tặng', exJp: 'プレゼントを 買いました。', exVi: 'Tôi đã mua quà tặng.' },
            { kanji: '荷物', hiragana: 'にもつ', meaning: 'Hành lý / Đồ đạc', exJp: 'もう 荷物を 送りましたか。', exVi: 'Anh/Chị đã gửi hành lý chưa?' },
            { kanji: 'お金', hiragana: 'おかね', meaning: 'Tiền', exJp: '銀行で お金を 借りました。', exVi: 'Tôi đã vay tiền ở ngân hàng.' },
            { kanji: '切符', hiragana: 'きっぷ', meaning: 'Vé', exJp: 'もう 切符を 買いましたか。', exVi: 'Anh/Chị đã mua vé chưa?' },
            { kanji: 'クリスマス', hiragana: 'くりすます', meaning: 'Lễ Giáng sinh', exJp: 'クリスマスに プレゼントを あげます。', exVi: 'Tôi tặng quà vào lễ Giáng sinh.' },
            { kanji: '父', hiragana: 'ちち', meaning: 'Bố (mình)', exJp: '父に シャツを もらいました。', exVi: 'Tôi nhận áo sơ mi từ bố.' },
            { kanji: '母', hiragana: 'はは', meaning: 'Mẹ (mình)', exJp: '母に メールを 送ります。', exVi: 'Tôi gửi email cho mẹ.' },
            { kanji: 'もう', hiragana: 'もう', meaning: 'Đã / Rồi', exJp: 'もう 昼ごはんを 食べましたか。', exVi: 'Anh/Chị đã ăn cơm trưa chưa?' }
        ];

        const extraDistractors = [
            "Học tập", "Làm việc", "Nghỉ ngơi", "Mới", "Cũ",
            "Buổi sáng", "Ngân hàng", "Trường học", "Căn phòng", "Ô tô"
        ];

        let currentIndex = 0;
        let answeredCurrent = false;
        let correctCount = 0;

        function updateCard() {
            const current = vocabList[currentIndex];
            document.getElementById('card-count').innerText = `${currentIndex + 1} / ${vocabList.length}`;
            document.getElementById('kanji-display').innerText = current.kanji;
            document.getElementById('hiragana-display').innerText = current.hiragana;
            document.getElementById('meaning-display').innerText = current.meaning;
            document.getElementById('example-jp').innerText = current.exJp;
            document.getElementById('example-vi').innerText = current.exVi;
            
            document.getElementById('card').classList.remove('flipped');
            answeredCurrent = false;

            let options = [current.meaning];
            vocabList.forEach(item => {
                if (!options.includes(item.meaning) && options.length < 4) {
                    options.push(item.meaning);
                }
            });

            let distractorIndex = 0;
            while (options.length < 4 && distractorIndex < extraDistractors.length) {
                let text = extraDistractors[distractorIndex];
                if (!options.includes(text)) {
                    options.push(text);
                }
                distractorIndex++;
            }

            options.sort(() => Math.random() - 0.5);

            const btns = document.querySelectorAll('.opt-btn');
            btns.forEach((btn, i) => {
                btn.innerText = options[i];
                btn.className = 'opt-btn';
                btn.disabled = false;
            });
        }

        function toggleFlip() {
            document.getElementById('card').classList.toggle('flipped');
        }

        function checkAnswer(btn) {
            if(answeredCurrent) return;
            answeredCurrent = true;

            document.getElementById('card').classList.add('flipped');

            if(btn.innerText === vocabList[currentIndex].meaning) {
                btn.classList.add('correct');
                correctCount++;
            } else {
                btn.classList.add('wrong');
            }

            const btns = document.querySelectorAll('.opt-btn');
            btns.forEach(b => b.disabled = true);
        }

        function nextCard() {
            if (currentIndex === vocabList.length - 1) {
                showCongrats();
                return;
            }
            currentIndex++;
            updateCard();
        }

        function prevCard() {
            if (currentIndex > 0) {
                currentIndex--;
                updateCard();
            }
        }

        function showCongrats() {
            document.getElementById('learning-section').style.display = 'none';
            document.getElementById('congrats-section').style.display = 'flex';
            document.getElementById('score-text').innerText = `${correctCount} / ${vocabList.length}`;
        }

        function restartLesson() {
            currentIndex = 0;
            correctCount = 0;
            document.getElementById('congrats-section').style.display = 'none';
            document.getElementById('learning-section').style.display = 'block';
            updateCard();
        }

        updateCard();
    </script>
</body>
</html>
